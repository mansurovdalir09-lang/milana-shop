<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Milana — генератор постов</title>
<!--
  Генератор картинок для постов Milana (опт). Параметры в адресе:
    ?layout=single&id=131                 — один товар (1080×1350)
    ?layout=collage&ids=131,141,126,123&title=Пижамы оптом
    ?layout=pack&id=101                   — что в упаковке
    ?layout=category&cat=Халаты&ids=125,47,129
    ?layout=story&id=141                  — сторис / статус WhatsApp (1080×1920)
  Необязательно: &tag=Хит продаж  &contact=@milana_opt  &note=Отгрузка за 24 часа
  Рендер в PNG: node render.js "layout=single&id=131" out.png
-->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F5EDE3;--card:#FBF7F2;--beige:#C4956A;--beige-l:#E8D5C0;--deep:#A87A52;--green:#5C6E50;--gd:#3D4A35;--red:#C44049;--dark:#1A1410;--muted:#7A6B5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--dark);font-family:'Jost',sans-serif}
.c{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(70% 45% at 50% 30%,#FAF1E6 0%,rgba(250,241,230,0) 70%),var(--bg)}
.c.story{height:1920px}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:-.01em}
.logo{position:absolute;top:56px;right:56px;width:200px;padding:18px 22px;border-radius:30px;background:rgba(255,253,251,.88);z-index:5}
.tag{position:absolute;top:60px;left:56px;z-index:5;padding:18px 30px;border-radius:40px;background:var(--red);color:#fff;font-size:28px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
/* фото: размытая подложка + целое фото по центру */
.ph{position:relative;overflow:hidden;border-radius:56px;background:var(--beige-l)}
.ph .blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) saturate(1.05);opacity:.75}
.ph .img{position:relative;width:100%;height:100%;object-fit:contain}
.meta{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);font-weight:600}
.chips{display:flex;gap:18px;flex-wrap:wrap}
.chip{border-radius:32px;padding:22px 30px;background:var(--card);font-size:28px;color:var(--muted);line-height:1.15}
.chip b{display:block;font-size:46px;color:var(--gd);font-weight:600;margin-top:4px}
.chip.main{background:var(--gd);color:var(--beige-l)}.chip.main b{color:#fff}
.foot{position:absolute;left:56px;right:56px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:var(--muted)}
.foot b{color:var(--gd);font-weight:600}
/* single */
.single .ph{position:absolute;left:40px;right:40px;top:40px;height:790px}
.single .info{position:absolute;left:72px;right:72px;top:860px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:6px}
.top .left{display:flex;align-items:center;gap:20px}
.top .logo,.top .tag{position:static}
.top .logo{width:170px;padding:14px 18px;background:var(--card)}
.top .tag{padding:12px 22px;font-size:24px}
.single h1{font-size:62px;line-height:1.02;margin:10px 0 24px}
/* collage */
.collage .head{position:absolute;left:64px;top:64px;right:300px}
.collage h1{font-size:96px;line-height:.95}
.collage .sub{font-size:32px;color:var(--muted);margin-top:14px}
.grid{position:absolute;left:40px;right:40px;top:290px;bottom:110px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px}
.grid>div{position:relative;min-height:0;overflow:hidden;border-radius:40px}.grid .ph{border-radius:40px;height:100%}
.grid .pr{position:absolute;left:18px;bottom:18px;padding:12px 20px;border-radius:24px;background:rgba(255,253,251,.92);font-size:26px;font-weight:600;color:var(--gd)}
/* pack */
.pack .ph{position:absolute;left:40px;top:250px;width:560px;height:700px;border-radius:44px}
.pack .ph .img{object-fit:cover}
.pack .side{position:absolute;left:640px;right:56px;top:240px}
.pack h1{font-size:76px;line-height:.98}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0}
.sizes span{height:96px;border-radius:24px;background:var(--card);display:grid;place-items:center;font-size:40px;font-weight:600;color:var(--gd)}
.calc{font-size:32px;color:var(--muted);line-height:1.4}
.calc b{display:block;font-size:64px;color:var(--gd);margin-top:6px}
.pack .name{font-size:30px;margin-top:34px;line-height:1.3}
.pack .logo{right:auto;left:40px;top:60px}
/* category */
.category .head{position:absolute;left:64px;right:64px;top:110px;text-align:center}
.category h1{font-size:120px;line-height:.92}
.category .sub{font-size:40px;color:var(--muted);margin-top:18px}
.category .sub b{color:var(--gd)}
.fan{position:absolute;left:0;right:0;top:470px;height:700px}
.fan .ph{position:absolute;width:420px;height:560px;border:8px solid #fff;border-radius:44px;box-shadow:0 40px 70px -30px rgba(61,45,30,.55)}
.fan .ph:nth-child(1){left:70px;top:80px;transform:rotate(-8deg)}
.fan .ph:nth-child(2){left:330px;top:0;z-index:2;width:440px;height:600px}
.fan .ph:nth-child(3){right:70px;top:80px;transform:rotate(8deg)}
.category .logo{left:50%;transform:translateX(-50%);right:auto;top:auto;bottom:120px}
/* story */
.story .ph{position:absolute;left:40px;right:40px;top:40px;height:1240px}
.story .info{position:absolute;left:72px;right:72px;top:1310px}
.story h1{font-size:72px;line-height:1.02;margin:14px 0 30px}
.story .cta{position:absolute;left:56px;right:56px;bottom:70px;height:120px;border-radius:60px;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:500}
</style></head>
<body><div id="root"></div>
<script src="../data.js"></script>
<script>
const q=new URLSearchParams(location.search), P=window.MILANA_PRODUCTS.filter(p=>p.id>14);
const by=id=>P.find(p=>p.id===+id);
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sizes=s=>{const m=(s||'').match(/^(\d+)\s*[-–]\s*(\d+)$/);if(!m)return s?[s]:[];const r=[];for(let x=+m[1];x<=+m[2];x+=2)r.push(x);return r};
const dash=s=>(s||'').replace('-','–');
const contact=q.get('contact')||'+7 953 890-66-64';
const note=q.get('note')||'Отгрузка за 24 часа · доставка по России';
const ph=(p,cls='')=>`<div class="ph ${cls}"><img class="blur" src="../${p.img}"><img class="img" src="../${p.img}"></div>`;
const logo=`<img class="logo" src="../logo.svg">`;
const tag=q.get('tag')?`<div class="tag">${esc(q.get('tag'))}</div>`:'';
const foot=`<div class="foot"><span>Заказ: <b>${esc(contact)}</b></span><span>${esc(note)}</span></div>`;
const topRow=p=>`<div class="top"><div class="left">${tag}<div class="meta">Milana · ${esc(p.cat)} · арт. ${p.id}</div></div>${logo}</div>`;
const chips=p=>`<div class="chips"><div class="chip main">Упаковка · ${p.pack} шт<b>${rub(p.packPrice)}</b></div><div class="chip">Размерный ряд<b>${dash(p.sizes)}</b></div></div>`;
const L={
 single(){const p=by(q.get('id'));return `<div class="c single">${ph(p)}
  <div class="info">${topRow(p)}<h1 class="serif">${esc(p.name)}</h1>${chips(p)}</div>${foot}</div>`},
 collage(){const ids=(q.get('ids')||'').split(',').map(by).filter(Boolean).slice(0,4);const title=q.get('title')||(ids[0].cat+' оптом');
  const min=Math.min(...ids.map(p=>p.packPrice));
  return `<div class="c collage"><div class="head"><h1 class="serif">${esc(title)}</h1><div class="sub">Упаковки по ${[...new Set(ids.map(p=>p.pack))].join('/')} шт · от ${rub(min)} за упаковку</div></div>${logo}
  <div class="grid">${ids.map(p=>`<div style="position:relative">${ph(p)}<div class="pr">арт. ${p.id} · ${rub(p.packPrice)}/уп.</div></div>`).join('')}</div>${foot}</div>`},
 pack(){const p=by(q.get('id'));const sz=sizes(p.sizes);return `<div class="c pack">${ph(p)}${logo}
  <div class="side"><div class="meta">Что в упаковке</div><h1 class="serif">${p.pack} штук,<br>${sz.length} размеров</h1>
  <div class="sizes">${sz.map(s=>`<span>${s}</span>`).join('')}</div>
  <div class="calc">Цена за упаковку<b>${rub(p.packPrice)}</b></div>
  <div class="name">${esc(p.name)} · арт. ${p.id}</div></div>${foot}</div>`},
 category(){const cat=q.get('cat');const all=P.filter(p=>p.cat===cat);const ids=(q.get('ids')||'').split(',').map(by).filter(Boolean);
  const pick=(ids.length?ids:all).slice(0,3);const min=Math.min(...all.map(p=>p.packPrice));
  return `<div class="c category"><div class="head"><h1 class="serif">${esc(cat)} оптом</h1><div class="sub">от <b>${rub(min)}</b> за упаковку · ${all.length} моделей</div></div>
  <div class="fan">${pick.map(p=>ph(p)).join('')}</div>${logo}${foot}</div>`},
 story(){const p=by(q.get('id'));return `<div class="c story">${ph(p)}
  <div class="info">${topRow(p)}<h1 class="serif">${esc(p.name)}</h1>${chips(p)}</div>
  <div class="cta">Заказ: ${esc(contact)}</div></div>`}
};
document.getElementById('root').innerHTML=(L[q.get('layout')]||L.single)();
</script></body></html>
