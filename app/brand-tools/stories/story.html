<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Milana — карточка сторис</title>
<!-- Карточка для статуса WhatsApp / сторис 1080×1920. ?n=1 — номер из stories.json.
     Рендер всех: node render-stories.js out/  (сервер из папки app/ на порту 8765) -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--bg:#F5EDE3;--card:#FBF7F2;--deep:#A87A52;--gd:#3D4A35;--beige-l:#E8D5C0;--dark:#1A1410;--muted:#7A6B5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Jost',sans-serif;color:var(--dark)}
.c{position:relative;width:1080px;height:1920px;background:radial-gradient(60% 30% at 50% 80%,#FAF1E6 0%,rgba(250,241,230,0) 70%),var(--bg)}
.ph{position:absolute;left:40px;top:40px;width:1000px;height:1250px;border-radius:48px;overflow:hidden;background:var(--beige-l);box-shadow:0 30px 60px -36px rgba(61,45,30,.55)}
.ph img{width:100%;height:100%;object-fit:cover}
.info{position:absolute;left:64px;right:64px;top:1336px}
.meta{font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);font-weight:600}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:68px;line-height:1.02;margin:14px 0 30px;letter-spacing:-.01em}
.chips{display:flex;gap:18px}
.chip{border-radius:34px;padding:22px 32px;background:var(--card);font-size:28px;color:var(--muted);line-height:1.1}
.chip b{display:block;font-size:50px;color:var(--gd);font-weight:600;margin-top:6px}
.chip.main{background:var(--gd);color:var(--beige-l)}.chip.main b{color:#fff}
.cta{position:absolute;left:40px;right:40px;bottom:44px;height:118px;border-radius:59px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 44px}
.cta span{font-size:34px;color:var(--muted)}.cta b{color:var(--gd);font-weight:600}
.cta img{height:84px;padding:12px 20px;background:#fff;border-radius:42px}
</style></head>
<body><div id="root"></div>
<script>
fetch('stories.json').then(r=>r.json()).then(list=>{
  const n=+(new URLSearchParams(location.search).get('n')||1), s=list.find(x=>x.n===n)||list[0];
  const rub=v=>v.toLocaleString('ru-RU')+' ₽', esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const contact=new URLSearchParams(location.search).get('contact')||'+7 953 890-66-64';
  document.getElementById('root').innerHTML=`<div class="c"><div class="ph"><img src="${s.img}" alt=""></div>
   <div class="info"><div class="meta">Milana · ${esc(s.cat)}${s.code?' · '+esc(s.code):''} · опт</div><h1>${esc(s.name)}</h1>
   <div class="chips"><div class="chip main">Упаковка ${s.pack} шт<b>${rub(s.price*s.pack)}</b></div><div class="chip">Размерный ряд<b>${esc(s.sizes)}</b></div></div></div>
   <div class="cta"><span>Заказ: <b>${esc(contact)}</b></span><img src="../../logo.svg" alt="Milana"></div></div>`;
  document.body.dataset.ready=1;
});
</script></body></html>
